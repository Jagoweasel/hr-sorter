version: '3.8'

services:
  hr-sorter:
    build: .
    ports:
      - "${HTTP_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - DB_PATH=/app/data/hr-sorter.db
      - HTTP_PORT=3000
      - HH_CLIENT_ID=${HH_CLIENT_ID}
      - HH_CLIENT_SECRET=${HH_CLIENT_SECRET}
      # For Playwright in container
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 # If already installed in Dockerfile
      - HEADLESS=true
    restart: unless-stopped
