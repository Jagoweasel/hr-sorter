version: '3.8'

services:
  hr-sorter:
    build: .
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      # Map host DB path if it's relative to project root
      # Assuming hr-sorter.db in root for development
      - .:/app/project_root
    environment:
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - DB_PATH=/app/data/hr-sorter.db
      - HTTP_PORT=8080
      - HH_CLIENT_ID=${HH_CLIENT_ID}
      - HH_CLIENT_SECRET=${HH_CLIENT_SECRET}
      # For Playwright in container
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 # If already installed in Dockerfile
      - HEADLESS=true
    restart: unless-stopped

volumes:
  sqlite_data:
