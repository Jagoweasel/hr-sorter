{{ define "content" }}
<div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800 dark:text-white">{{ Tr "vacancy_mapping" }}</h2>
        <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors">
            {{ Tr "add_rule" }}
        </button>
    </div>

    <div class="bg-white dark:bg-gray-800 shadow-md rounded-lg overflow-hidden border dark:border-gray-700">
        <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
            <thead class="bg-gray-50 dark:bg-gray-700">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">{{ Tr "pattern" }}</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">{{ Tr "category" }}</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">{{ Tr "actions" }}</th>
                </tr>
            </thead>
            <tbody class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                {{ range . }}
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 dark:text-white">{{ .Pattern }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">{{ .Category }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick='openEditModal({{ .ID }}, "{{ .Pattern }}", "{{ .Category }}")' class="text-blue-600 hover:text-blue-900 dark:text-blue-400 dark:hover:text-blue-300 mr-3">{{ Tr "edit" }}</button>
                        <button hx-delete="/mapping/delete?id={{ .ID }}" hx-confirm="{{ Tr "confirm_delete_rule" }}" class="text-red-600 hover:text-red-900 dark:text-red-400 dark:hover:text-red-300">{{ Tr "delete" }}</button>
                    </td>
                </tr>
                {{ else }}
                <tr>
                    <td colspan="3" class="px-6 py-4 text-center text-sm text-gray-500 dark:text-gray-400 italic">{{ Tr "no_mapping_rules" }}</td>
                </tr>
                {{ end }}
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="mapping-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white dark:bg-gray-800">
        <div class="mt-3">
            <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white" id="modal-title">{{ Tr "add_rule" }}</h3>
            <form action="/mapping/save" method="POST" class="mt-4">
                {{ csrfField }}
                <input type="hidden" name="id" id="rule-id">
                <div class="mb-4">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2" for="pattern">{{ Tr "pattern_regex" }}</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-white dark:bg-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="pattern" name="pattern" type="text" placeholder="{{ Tr "pattern_placeholder" }}" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2" for="category">{{ Tr "category" }}</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-white dark:bg-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="category" name="category" type="text" placeholder="{{ Tr "category_placeholder" }}" required>
                </div>
                <div class="flex items-center justify-end space-x-2">
                    <button type="button" onclick="closeModal()" class="bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white px-4 py-2 rounded hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">{{ Tr "cancel" }}</button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition-colors">{{ Tr "save" }}</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function openAddModal() {
        document.getElementById('modal-title').textContent = '{{ Tr "add_rule" }}';
        document.getElementById('rule-id').value = '';
        document.getElementById('pattern').value = '';
        document.getElementById('category').value = '';
        document.getElementById('mapping-modal').classList.remove('hidden');
    }

    function openEditModal(id, pattern, category) {
        document.getElementById('modal-title').textContent = '{{ Tr "edit" }}';
        document.getElementById('rule-id').value = id;
        document.getElementById('pattern').value = pattern;
        document.getElementById('category').value = category;
        document.getElementById('mapping-modal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('mapping-modal').classList.add('hidden');
    }
</script>
{{ end }}
