<div class="fixed inset-0 bg-black/20 backdrop-blur-[1px] flex items-center justify-center z-[100]" id="modal" onclick="if(event.target === this) htmx.remove('#modal')">
    <div class="bg-white dark:bg-gray-800 border dark:border-gray-700 shadow-2xl rounded-2xl p-2 w-64 overflow-hidden" onclick="event.stopPropagation()">
        <div class="px-4 py-3 border-b dark:border-gray-700 mb-1">
            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">{{ Tr "recruiter_actions" }}</p>
        </div>
        <button class="w-full text-left px-4 py-3 hover:bg-blue-50 dark:hover:bg-blue-900/30 text-blue-700 dark:text-blue-400 font-bold text-sm transition-colors rounded-xl flex items-center justify-between group"
                hx-get="/contacts/{{ .ID }}/create-sequence-modal"
                hx-target="#modal-container"
                hx-on:htmx:after-request="htmx.remove('#modal')">
            {{ Tr "start_sequence" }}
            <span class="opacity-0 group-hover:opacity-100 transition-opacity">→</span>
        </button>
        <button class="w-full text-left px-4 py-3 hover:bg-blue-50 dark:hover:bg-blue-900/30 text-gray-700 dark:text-gray-300 font-bold text-sm transition-colors rounded-xl flex items-center justify-between group"
                hx-get="/contacts/{{ .ID }}/add-to-sequence-modal"
                hx-target="#modal-container"
                hx-on:htmx:after-request="htmx.remove('#modal')">
                {{ Tr "add_to_existing" }}
            <span class="opacity-0 group-hover:opacity-100 transition-opacity">→</span>
        </button>
        {{ if .IsIgnored }}
        <button class="w-full text-left px-4 py-3 hover:bg-green-50 dark:hover:bg-green-900/30 text-green-700 dark:text-green-400 font-bold text-sm transition-colors rounded-xl flex items-center justify-between group"
                hx-post="/contacts/{{ .ID }}/restore"
                hx-swap="none"
                hx-on:htmx:after-request="htmx.remove('#modal')">
            {{ Tr "restore_recruiter" }}
            <span class="opacity-0 group-hover:opacity-100 transition-opacity">↺</span>
        </button>
        {{ else }}
        <button class="w-full text-left px-4 py-3 hover:bg-red-50 dark:hover:bg-red-900/30 text-red-700 dark:text-red-400 font-bold text-sm transition-colors rounded-xl flex items-center justify-between group"
                hx-post="/contacts/{{ .ID }}/ignore"
                hx-swap="none"
                hx-on:htmx:after-request="htmx.remove('#modal')">
            {{ Tr "ignore_recruiter" }}
            <span class="opacity-0 group-hover:opacity-100 transition-opacity">✕</span>
        </button>
        {{ end }}
        <div class="p-2 border-t dark:border-gray-700 mt-1">

            <button onclick="htmx.remove('#modal')" class="w-full py-2 text-[10px] font-black text-gray-400 uppercase hover:text-gray-600 dark:hover:text-gray-200 transition-colors">{{ Tr "cancel" }}</button>
        </div>
    </div>
</div>
