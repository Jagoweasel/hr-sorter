<div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[200]" id="modal" onclick="if(event.target === this) htmx.remove('#modal')">
    <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-lg relative" onclick="event.stopPropagation()">
        <h2 class="text-xl font-black text-gray-900 tracking-tight mb-6">Edit Interview Sequence</h2>
        <form action="/sequences/update" method="POST" class="grid grid-cols-2 gap-4">
            <input type="hidden" name="id" value="{{ .ID }}">
            
            <div class="col-span-1">
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Company Name</label>
                <input type="text" name="company_name" value="{{ .CompanyName }}" required class="block w-full border-2 border-gray-100 rounded-xl p-3 text-sm font-bold bg-gray-50 focus:border-blue-500 outline-none transition-colors">
            </div>
            
            <div class="col-span-1">
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Vacancy Name</label>
                <input type="text" name="vacancy_name" value="{{ .VacancyName }}" required class="block w-full border-2 border-gray-100 rounded-xl p-3 text-sm font-bold bg-gray-50 focus:border-blue-500 outline-none transition-colors">
            </div>

            <div class="col-span-2">
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Vacancy Link</label>
                <input type="url" name="vacancy_link" value="{{ deref .VacancyLink }}" class="block w-full border-2 border-gray-100 rounded-xl p-3 text-sm font-bold bg-gray-50 focus:border-blue-500 outline-none transition-colors" placeholder="https://hh.ru/vacancy/...">
            </div>

            <div class="col-span-2">
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Rejection / Drop Reason</label>
                <input type="text" name="rejection_reason" value="{{ deref .RejectionReason }}" class="block w-full border-2 border-gray-100 rounded-xl p-3 text-sm font-bold bg-gray-50 focus:border-blue-500 outline-none transition-colors" placeholder="e.g. Budget mismatch, Lack of Go experience">
            </div>

            <div class="col-span-2">
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Sequence Notes (Internal)</label>
                <textarea name="summary_comment" rows="3" class="block w-full border-2 border-gray-100 rounded-xl p-3 text-sm font-bold bg-gray-50 focus:border-blue-500 outline-none transition-colors" placeholder="Arbitrary notes about this specific interview process...">{{ deref .SummaryComment }}</textarea>
            </div>

            <div class="col-span-2 flex justify-end space-x-3 pt-4 border-t mt-2">
                <button type="button" onclick="htmx.remove('#modal')" class="px-4 py-2 text-[10px] font-black text-gray-400 uppercase hover:text-gray-600 transition-colors">Cancel</button>
                <button type="submit" class="px-8 py-2.5 bg-gray-900 text-white rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg hover:bg-black transition-all">Save Changes</button>
            </div>
        </form>
    </div>
</div>
