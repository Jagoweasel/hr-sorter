<div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[200]" id="modal" onclick="if(event.target === this) htmx.remove('#modal')">
    <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-2xl p-8 w-full max-w-lg relative" onclick="event.stopPropagation()">
        <h2 class="text-xl font-black text-gray-900 dark:text-white tracking-tight mb-6">{{ Tr "edit_interview_sequence" }}</h2>
        <form action="/sequences/update" method="POST" class="grid grid-cols-2 gap-4">
            <input type="hidden" name="id" value="{{ .ID }}">
            
            <div class="col-span-1">
                <label class="block text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-2">{{ Tr "company_name" }}</label>
                <input type="text" name="company_name" value="{{ .CompanyName }}" required class="block w-full border-2 border-gray-100 dark:border-gray-700 rounded-xl p-3 text-sm font-bold bg-gray-50 dark:bg-gray-700 dark:text-white focus:border-blue-500 outline-none transition-colors">
            </div>
            
            <div class="col-span-1">
                <label class="block text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-2">{{ Tr "vacancy_name" }}</label>
                <input type="text" name="vacancy_name" value="{{ .VacancyName }}" required class="block w-full border-2 border-gray-100 dark:border-gray-700 rounded-xl p-3 text-sm font-bold bg-gray-50 dark:bg-gray-700 dark:text-white focus:border-blue-500 outline-none transition-colors">
            </div>

            <div class="col-span-2">
                <label class="block text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-2">{{ Tr "vacancy_link" }}</label>
                <input type="url" name="vacancy_link" value="{{ deref .VacancyLink }}" class="block w-full border-2 border-gray-100 dark:border-gray-700 rounded-xl p-3 text-sm font-bold bg-gray-50 dark:bg-gray-700 dark:text-white focus:border-blue-500 outline-none transition-colors" placeholder="https://hh.ru/vacancy/...">
            </div>

            <div class="col-span-2">
                <label class="block text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-2">{{ Tr "rejection_drop_reason" }}</label>
                <input type="text" name="rejection_reason" value="{{ deref .RejectionReason }}" class="block w-full border-2 border-gray-100 dark:border-gray-700 rounded-xl p-3 text-sm font-bold bg-gray-50 dark:bg-gray-700 dark:text-white focus:border-blue-500 outline-none transition-colors" placeholder="{{ Tr "rejection_reason_placeholder" }}">
            </div>

            <div class="col-span-2">
                <label class="block text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-2">{{ Tr "sequence_notes" }}</label>
                <textarea name="summary_comment" rows="3" class="block w-full border-2 border-gray-100 dark:border-gray-700 rounded-xl p-3 text-sm font-bold bg-gray-50 dark:bg-gray-700 dark:text-white focus:border-blue-500 outline-none transition-colors" placeholder="{{ Tr "sequence_notes_placeholder" }}">{{ deref .SummaryComment }}</textarea>
            </div>

            <div class="col-span-2 flex justify-end space-x-3 pt-4 border-t dark:border-gray-700 mt-2">
                <button type="button" onclick="htmx.remove('#modal')" class="px-4 py-2 text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase hover:text-gray-600 dark:hover:text-gray-300 transition-colors">{{ Tr "cancel" }}</button>
                <button type="submit" class="px-8 py-2.5 bg-gray-900 dark:bg-gray-700 text-white rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg hover:bg-black dark:hover:bg-gray-600 transition-all">{{ Tr "save_changes" }}</button>
            </div>
        </form>
    </div>
</div>
