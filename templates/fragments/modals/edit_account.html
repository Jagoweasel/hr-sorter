<div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[200]" id="modal" onclick="if(event.target === this) htmx.remove('#modal')">
    <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-sm relative" onclick="event.stopPropagation()">
        <h2 class="text-xl font-black text-gray-900 tracking-tight mb-6">Edit Account</h2>
        <form action="/accounts/update" method="POST" class="space-y-6">
            <input type="hidden" name="id" value="{{ .ID }}">
            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Account Name</label>
                <input type="text" name="name" value="{{ .Name }}" required class="block w-full border-2 border-gray-100 rounded-xl p-3 text-sm font-bold bg-gray-50 focus:border-blue-500 outline-none transition-colors" placeholder="e.g. Personal, Work, Agency">
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Report Slug (Latin)</label>
                <input type="text" name="slug" value="{{ deref .Slug }}" class="block w-full border-2 border-gray-100 rounded-xl p-3 text-sm font-bold bg-gray-50 focus:border-blue-500 outline-none transition-colors" placeholder="e.g. egor_reshetnikov">
                <p class="text-[9px] text-gray-400 mt-1 italic">Used for naming sheets in Excel reports. Leave empty to auto-generate.</p>
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" onclick="htmx.remove('#modal')" class="px-4 py-2 text-[10px] font-black text-gray-400 uppercase">Cancel</button>
                <button type="submit" class="px-6 py-2 bg-gray-900 text-white rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg">Save</button>
            </div>
        </form>
    </div>
</div>
