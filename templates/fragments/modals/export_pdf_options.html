<div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[200]" id="modal" onclick="if(event.target === this) htmx.remove('#modal')">
    <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-sm relative" onclick="event.stopPropagation()">
        <h2 class="text-xl font-black text-gray-900 tracking-tight mb-6">PDF Export Options</h2>
        <form action="/reports/export/pdf" method="POST" class="space-y-4" hx-boost="false">
            <input type="hidden" name="account_id" value="{{ .AccountID }}">
            
            <div class="space-y-2">
                <label class="flex items-center space-x-3 cursor-pointer p-2 hover:bg-gray-50 rounded-xl transition-colors">
                    <input type="checkbox" name="include_kpis" checked class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <span class="text-sm font-bold text-gray-700">Summary KPIs</span>
                </label>
                
                <label class="flex items-center space-x-3 cursor-pointer p-2 hover:bg-gray-50 rounded-xl transition-colors">
                    <input type="checkbox" name="include_funnel" checked class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <span class="text-sm font-bold text-gray-700">Recruitment Funnel</span>
                </label>

                <label class="flex items-center space-x-3 cursor-pointer p-2 hover:bg-gray-50 rounded-xl transition-colors">
                    <input type="checkbox" name="include_vacancies" class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <span class="text-sm font-bold text-gray-700">Report by Vacancies</span>
                </label>

                <label class="flex items-center space-x-3 cursor-pointer p-2 hover:bg-gray-50 rounded-xl transition-colors">
                    <input type="checkbox" name="include_companies" checked class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <span class="text-sm font-bold text-gray-700">Report by Companies</span>
                </label>

                <label class="flex items-center space-x-3 cursor-pointer p-2 hover:bg-gray-50 rounded-xl transition-colors">
                    <input type="checkbox" name="include_detailed" checked class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <span class="text-sm font-bold text-gray-700">Detailed Applicants</span>
                </label>

                <label class="flex items-center space-x-3 cursor-pointer p-2 hover:bg-gray-50 rounded-xl transition-colors">
                    <input type="checkbox" name="include_timeline" checked class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <span class="text-sm font-bold text-gray-700">Applicant Timelines</span>
                </label>
            </div>

            <div class="flex justify-end space-x-3 pt-6">
                <button type="button" onclick="htmx.remove('#modal')" class="px-4 py-2 text-[10px] font-black text-gray-400 uppercase hover:text-gray-600 transition-colors">Cancel</button>
                <button type="submit" class="px-8 py-2.5 bg-red-600 text-white rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg hover:bg-red-700 transition-all flex items-center space-x-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span>Download PDF</span>
                </button>
            </div>
        </form>
    </div>
</div>
