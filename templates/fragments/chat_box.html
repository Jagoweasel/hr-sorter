<div class="p-4 bg-white border-t border-gray-100">
    <form hx-post="/messages/{{ .ContactID }}/send" 
          hx-swap="none" 
          hx-on::after-request="this.reset(); document.getElementById('message-textarea').focus();"
          class="flex items-end space-x-2">
        <div class="flex-1 relative">
            <textarea id="message-textarea"
                      name="text" 
                      rows="1" 
                      placeholder="Type a message..." 
                      class="w-full bg-gray-50 border-2 border-gray-100 rounded-xl px-4 py-3 text-sm focus:border-blue-500 outline-none transition-all resize-none overflow-y-auto max-h-32"
                      onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); this.form.dispatchEvent(new Event('submit', {bubbles: true, cancelable: true})); }"
                      oninput="this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'"></textarea>
        </div>
        <button type="submit" 
                class="bg-blue-600 text-white p-3 rounded-xl hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200 flex items-center justify-center">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
        </button>
    </form>
</div>
