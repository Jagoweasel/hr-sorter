<div class="flex flex-col space-y-2 p-4">
    {{ if .Messages }}
        {{ range .Messages }}
        <div class="flex flex-col {{ if .IsIncoming }}items-start{{ else }}items-end{{ end }}">
            <div class="{{ if .IsIncoming }}bg-blue-100{{ else }}bg-green-100{{ end }} p-3 rounded-2xl max-w-[85%] shadow-sm border {{ if .IsIncoming }}border-blue-200{{ else }}border-green-200{{ end }}">
                <p class="text-sm text-gray-800 whitespace-pre-wrap">{{ .Text }}</p>
                <div class="flex items-center justify-end space-x-1 mt-1">
                    <p class="text-[9px] text-gray-500">{{ formatTime .Timestamp }}</p>
                    {{ if not .IsIncoming }}
                        <svg class="w-3 h-3 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    {{ end }}
                </div>
            </div>
        </div>
        {{ end }}
    {{ else }}
        <div class="flex flex-col items-center justify-center h-64 text-gray-400">
            <p class="italic text-sm">No messages yet. Say hello!</p>
        </div>
    {{ end }}
</div>
