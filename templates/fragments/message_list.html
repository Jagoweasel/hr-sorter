<div class="flex flex-col space-y-2 p-2" hx-get="/messages/{{ .ContactID }}" hx-trigger="every 3s" hx-swap="outerHTML">
    {{ if .Messages }}
        {{ range .Messages }}
        <div class="flex flex-col {{ if .IsIncoming }}items-start{{ else }}items-end{{ end }}">
            <div class="{{ if .IsIncoming }}bg-blue-100{{ else }}bg-green-100{{ end }} p-3 rounded-lg max-w-[85%] shadow-sm">
                <p class="text-sm text-gray-800 whitespace-pre-wrap">{{ .Text }}</p>
                <p class="text-[9px] text-gray-500 mt-1 text-right">{{ formatTime .Timestamp }}</p>
            </div>
        </div>
        {{ end }}
    {{ else }}
        <p class="text-gray-500 italic p-4">No messages yet</p>
    {{ end }}
</div>
