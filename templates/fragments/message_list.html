<div class="flex flex-col space-y-2 p-4">
    {{ if .Messages }}
        {{ range .Messages }}
        <div class="flex flex-col {{ if .IsIncoming }}items-start{{ else }}items-end{{ end }}">
            <div class="{{ if .IsIncoming }}bg-blue-100 dark:bg-blue-900/40 border-blue-200 dark:border-blue-800{{ else }}bg-green-100 dark:bg-green-900/40 border-green-200 dark:border-green-800{{ end }} p-3 rounded-2xl max-w-[85%] shadow-sm border">
                <p class="text-sm text-gray-800 dark:text-gray-200 whitespace-pre-wrap">{{ .Text }}</p>
                <div class="flex items-center justify-end space-x-1 mt-1">
                    <p class="text-[9px] text-gray-500 dark:text-gray-400">{{ formatTime .Timestamp }}</p>
                    {{ if not .IsIncoming }}
                        <svg class="w-3 h-3 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    {{ end }}
                </div>
            </div>
        </div>
        {{ end }}
    {{ else }}
        <div class="flex flex-col items-center justify-center h-64 text-gray-400">
            <p class="italic text-sm">{{ Tr "no_messages_yet" }}</p>
        </div>
    {{ end }}
</div>
