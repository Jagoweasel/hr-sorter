<div id="seq-card-{{ .ID }}" class="bg-white dark:bg-gray-800 p-2.5 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 group/card relative hover:shadow-md transition-all flex flex-col space-y-1.5">
    <div class="absolute top-2 right-2 flex items-center space-x-1 opacity-0 group-hover/card:opacity-100 transition-opacity">
        <button hx-get="/sequences/edit-modal?id={{ .ID }}" hx-target="#modal-container" 
                class="p-0.5 text-gray-300 dark:text-gray-600 hover:text-blue-500 dark:hover:text-blue-400 transition-colors">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
        </button>
        <button class="p-0.5 text-gray-300 dark:text-gray-600 hover:text-red-500 transition-colors"
                hx-delete="/sequences/delete?id={{ .ID }}" hx-confirm="{{ Tr "confirm_delete_sequence" }}" hx-target="#seq-card-{{ .ID }}" hx-swap="outerHTML">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
    </div>
    <div class="absolute top-2 left-2 hidden bulk-checkbox-container">
        <input type="checkbox" name="sequence_ids" value="{{ .ID }}" class="w-3 h-3 rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500">
    </div>
    <div class="flex justify-between items-start">
        <div class="overflow-hidden pr-6 bulk-checkbox-container-padding">
            <h3 class="font-black text-gray-900 dark:text-white text-[11px] truncate leading-tight">{{ .CompanyName }}</h3>
            <p class="text-[8px] text-gray-400 dark:text-gray-500 font-bold uppercase mt-0.5 truncate">{{ .VacancyName }}</p>
        </div>
        <div class="flex -space-x-1 shrink-0 ml-1">
            {{ range .Recruiters }}
            <a href="/?contact_id={{ .ID }}" class="w-4 h-4 rounded-md bg-blue-50 dark:bg-blue-900/40 border border-white dark:border-gray-700 flex items-center justify-center text-[7px] font-black text-blue-600 dark:text-blue-400 shadow-sm hover:scale-110 transition-transform" title="{{ Tr "go_to_chat" }} {{ .FirstName }}">
                {{ slice .FirstName 0 1 }}
            </a>
            {{ end }}
        </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-between space-x-1 pt-1">
        <select class="flex-1 text-[8px] bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded px-1 py-0.5 font-black text-gray-500 dark:text-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-500/10 outline-none appearance-none hover:bg-gray-50 dark:hover:bg-gray-600 cursor-pointer disabled:opacity-50"
                hx-post="/sequences/move?id={{ .ID }}&view=kanban" hx-trigger="change" name="status" hx-target="#main-content" hx-swap="innerHTML" hx-disabled-elt="this">
            <option value="">{{ Tr "status" }}...</option>
            {{ range .ColumnDefs }}
            <option value="{{ .ID }}" {{ if eq .ID $.Status }}selected{{ end }}>{{ .Label }}</option>
            {{ end }}
        </select>
    </div>
</div>
