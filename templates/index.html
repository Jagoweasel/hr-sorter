{{ define "content" }}
<div class="grid grid-cols-12 gap-8 h-[calc(100vh-140px)]">
    <!-- Left: Recruiter/Contact List -->
    <div class="col-span-12 lg:col-span-4 bg-white rounded-xl shadow-lg flex flex-col overflow-hidden border border-gray-200">
        <div class="p-5 border-b bg-gray-50 flex justify-between items-center">
            <h2 class="text-xl font-bold text-gray-800">Recruiters</h2>
            <span class="bg-blue-600 text-white text-[10px] px-2 py-1 rounded-full animate-pulse uppercase font-bold tracking-widest">LIVE</span>
        </div>
        
        <div id="contact-list" 
             hx-get="/contacts" 
             hx-trigger="load, every 10s" 
             hx-swap="innerHTML" 
             class="flex-1 overflow-y-auto divide-y divide-gray-100">
            <div class="flex flex-col items-center justify-center h-full text-gray-400 p-8 space-y-4">
                <svg class="w-12 h-12 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="italic text-sm">Scanning for recruiters...</p>
            </div>
        </div>
    </div>

    <!-- Right: Message History -->
    <div class="col-span-12 lg:col-span-8 bg-white rounded-xl shadow-lg flex flex-col overflow-hidden border border-gray-200">
        <div class="p-5 border-b bg-gray-50">
            <h2 class="text-xl font-bold text-gray-800">Conversation</h2>
        </div>
        
        <div id="chat-history" 
             hx-trigger="every 5s"
             data-current-contact=""
             class="flex-1 overflow-y-auto bg-slate-50 relative">
            <div class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 space-y-4">
                <div class="p-6 bg-white rounded-full shadow-sm border border-gray-100">
                    <svg class="w-16 h-16 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                    </svg>
                </div>
                <div class="text-center">
                    <p class="font-medium text-gray-500">No contact selected</p>
                    <p class="text-sm">Pick a recruiter from the list to see your history.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Custom Scrollbar for a cleaner look */
    ::-webkit-scrollbar {
        width: 6px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
    }
</style>
{{ end }}
