{{ define "content" }}
<div class="flex flex-col space-y-4 h-[calc(100vh-140px)]">
    <!-- Top Filter Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between">
        <div class="flex items-center space-x-6">
            <div class="flex flex-col">
                <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-1">Active Account</label>
                <select name="account_id" 
                        class="bg-gray-50 border-2 border-gray-100 rounded-lg px-3 py-1.5 text-xs font-bold focus:border-blue-500 outline-none"
                        hx-get="/contacts"
                        hx-target="#contact-list"
                        hx-include="[name='platform'], [name='show_declines'], [name='hide_screened'], [name='hide_unanswered'], [name='sequence_filter']">
                    <option value="">All Accounts</option>
                    {{ range . }}
                    <option value="{{ .ID }}">{{ .Name }}</option>
                    {{ end }}
                </select>
            </div>

            <div class="flex flex-col">
                <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-1">Platform Filter</label>
                <input type="hidden" name="platform" id="platform-filter-input" value="">
                <div class="flex items-center space-x-2" id="plat-filters">
                    <button class="px-3 py-2 rounded-lg border-2 border-blue-500 bg-blue-50 transition-colors plat-btn active"
                            onclick="setPlatformFilter('', this)">
                        <span class="text-[10px] font-black uppercase">All</span>
                    </button>
                    <button class="p-2 rounded-lg border-2 border-gray-100 hover:border-blue-500 transition-colors flex items-center space-x-2 plat-btn"
                            onclick="setPlatformFilter('tg', this)">
                        <svg class="w-4 h-4 text-blue-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.35-.97.52-1.35.51-.42-.01-1.24-.24-1.84-.44-.74-.24-1.33-.37-1.28-.79.03-.22.33-.44.89-.67 3.49-1.52 5.82-2.52 6.99-3.01 3.32-1.39 4.02-1.63 4.47-1.63.1 0 .32.02.46.14.12.1.15.23.16.33.01.07.02.21.01.35z"/></svg>
                        <span class="text-[10px] font-black uppercase">TG</span>
                    </button>
                    <button class="p-2 rounded-lg border-2 border-gray-100 hover:border-blue-500 transition-colors flex items-center space-x-2 plat-btn"
                            onclick="setPlatformFilter('hh', this)">
                        <span class="text-red-500 font-black text-[10px] border border-red-200 px-1 rounded bg-red-50">HH</span>
                        <span class="text-[10px] font-black uppercase">HH</span>
                    </button>
                </div>
            </div>

            <div class="flex flex-col">
                <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-1">Declines</label>
                <select name="show_declines" 
                        class="bg-gray-50 border-2 border-gray-100 rounded-lg px-3 py-1.5 text-xs font-bold focus:border-blue-500 outline-none"
                        hx-get="/contacts"
                        hx-target="#contact-list"
                        hx-include="[name='account_id'], [name='platform'], [name='hide_screened'], [name='hide_unanswered'], [name='sequence_filter']">
                    <option value="false">Hide Declines</option>
                    <option value="true">Show All</option>
                </select>
            </div>

            <div class="flex flex-col">
                <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-1">Screening</label>
                <div class="flex items-center space-x-2">
                    <select name="hide_screened" 
                            class="bg-gray-50 border-2 border-gray-100 rounded-lg px-3 py-1.5 text-xs font-bold focus:border-blue-500 outline-none"
                            hx-get="/contacts"
                            hx-target="#contact-list"
                            hx-include="[name='account_id'], [name='platform'], [name='show_declines'], [name='hide_unanswered'], [name='sequence_filter']">
                        <option value="true">Hide Filtered</option>
                        <option value="false">Show All</option>
                    </select>
                    <button onclick="openFilterModal()" class="p-2 bg-gray-50 hover:bg-gray-100 border-2 border-gray-100 rounded-lg transition-colors text-gray-500" title="Manage Filters">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    </button>
                </div>
            </div>

            <div class="flex flex-col">
                <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-1">Response</label>
                <select name="hide_unanswered" 
                        class="bg-gray-50 border-2 border-gray-100 rounded-lg px-3 py-1.5 text-xs font-bold focus:border-blue-500 outline-none"
                        hx-get="/contacts"
                        hx-target="#contact-list"
                        hx-include="[name='account_id'], [name='platform'], [name='show_declines'], [name='hide_screened'], [name='show_ignored'], [name='sequence_filter']">
                    <option value="false">Show All</option>
                    <option value="true">Hide Unanswered</option>
                </select>
            </div>

            <div class="flex flex-col">
                <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-1">Ignored</label>
                <select name="show_ignored" 
                        class="bg-gray-50 border-2 border-gray-100 rounded-lg px-3 py-1.5 text-xs font-bold focus:border-blue-500 outline-none"
                        hx-get="/contacts"
                        hx-target="#contact-list"
                        hx-include="[name='account_id'], [name='platform'], [name='show_declines'], [name='hide_screened'], [name='hide_unanswered'], [name='sequence_filter']">
                    <option value="false">Active</option>
                    <option value="true">Ignored</option>
                </select>
            </div>

            <div class="flex flex-col">
                <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-1">Pipeline</label>
                <select name="sequence_filter" 
                        class="bg-gray-50 border-2 border-gray-100 rounded-lg px-3 py-1.5 text-xs font-bold focus:border-blue-500 outline-none"
                        hx-get="/contacts"
                        hx-target="#contact-list"
                        hx-include="[name='account_id'], [name='platform'], [name='show_declines'], [name='hide_screened'], [name='hide_unanswered'], [name='show_ignored']">
                    <option value="">All</option>
                    <option value="with">In Pipeline</option>
                    <option value="without">Not in Pipeline</option>
                </select>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-black uppercase tracking-widest transition-colors shadow-lg shadow-blue-100 flex items-center space-x-2"
                    hx-post="/sequences/bulk-add"
                    hx-include="[name='account_id'], [name='platform'], [name='show_declines'], [name='hide_screened'], [name='hide_unanswered'], [name='sequence_filter']"
                    hx-confirm="Add all visible unfiltered contacts to pipeline?"
                    hx-swap="none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                <span>Bulk Add</span>
            </button>
            <div class="flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-tighter">Sync Active</span>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-12 gap-6 flex-1 overflow-hidden">
        <!-- Left: Recruiter/Contact List -->
        <div class="col-span-12 lg:col-span-4 bg-white rounded-xl shadow-lg flex flex-col overflow-hidden border border-gray-200">
            <div id="contact-list" 
                 hx-get="/contacts" 
                 hx-trigger="load, every 15s, refreshContacts from:body" 
                 hx-swap="innerHTML" 
                 hx-include="[name='account_id'], [name='platform'], [name='show_declines'], [name='hide_screened'], [name='hide_unanswered'], [name='show_ignored']"
                 class="flex-1 overflow-y-auto divide-y divide-gray-100">
                <div class="flex flex-col items-center justify-center h-full text-gray-400 p-8 space-y-4">
                    <svg class="w-12 h-12 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="italic text-sm">Scanning recruiters...</p>
                </div>
            </div>
        </div>

        <!-- Right: Message History -->
        <div id="chat-container" class="col-span-12 lg:col-span-8 bg-white rounded-xl shadow-lg flex flex-col overflow-hidden border border-gray-200">
            <div class="flex-1 overflow-y-auto bg-slate-50 relative">
                <div class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 space-y-4">
                    <div class="p-6 bg-white rounded-full shadow-sm border border-gray-100">
                        <svg class="w-16 h-16 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                        </svg>
                    </div>
                    <div class="text-center">
                        <p class="font-medium text-gray-500">Select contact</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
</div>

<!-- Modal: Filter Management -->
<div id="filter-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-[300]" onclick="if(event.target === this) closeFilterModal()">
    <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-lg relative" onclick="event.stopPropagation()">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black text-gray-900 tracking-tight">Message Filters (HH)</h2>
            <button onclick="closeFilterModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <p class="text-xs text-gray-500 mb-6 bg-blue-50 p-3 rounded-xl border border-blue-100">
            Contacts whose <span class="font-bold">last message</span> contains any of these phrases will be hidden when "Hide Filtered" is active.
        </p>

        <form hx-post="/filters/add" class="mb-6 flex space-x-2">
            <input type="text" name="pattern" placeholder="e.g. we will call you" required class="flex-1 border-2 border-gray-100 rounded-xl px-4 py-2 text-sm font-bold bg-gray-50 focus:border-blue-500 outline-none transition-colors">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-black text-xs uppercase tracking-widest hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200">Add</button>
        </form>

        <div id="filter-list-content" hx-get="/filters" hx-trigger="load, refreshFilters from:body" class="max-h-96 overflow-y-auto pr-2 mb-6">
            <!-- Loaded via HTMX -->
        </div>

        <div class="flex flex-col items-center space-y-4">
            <div class="flex items-center justify-center space-x-6">
                <button hx-post="/filters/import" 
                        hx-swap="none"
                        class="text-[10px] font-black text-gray-400 uppercase hover:text-blue-600 transition-colors flex items-center space-x-2"
                        onclick="this.innerText = 'Imported!'; setTimeout(() => this.innerText = 'Import from filters.json', 2000)">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span>Import from filters.json</span>
                </button>

                <button hx-post="/filters/export" 
                        hx-swap="none"
                        class="text-[10px] font-black text-gray-400 uppercase hover:text-blue-600 transition-colors flex items-center space-x-2"
                        onclick="this.innerText = 'Exported!'; setTimeout(() => this.innerText = 'Export to filters.json', 2000)">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span>Export to filters.json</span>
                </button>
            </div>

            <div class="flex items-center justify-center space-x-6">
                <form id="filter-upload-form" hx-post="/filters/upload" hx-encoding="multipart/form-data" hx-swap="none" class="inline">
                    <input type="file" name="file" id="filter-upload-input" class="hidden" onchange="if(this.value) this.form.requestSubmit()">
                    <button type="button" onclick="document.getElementById('filter-upload-input').click()"
                            class="text-[10px] font-black text-gray-400 uppercase hover:text-indigo-600 transition-colors flex items-center space-x-2">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <span class="htmx-indicator-hide">Upload JSON</span>
                        <span class="htmx-indicator">Processing...</span>
                    </button>
                </form>

                <button hx-post="/filters/clear" 
                        hx-confirm="Are you sure you want to delete ALL filter patterns?"
                        hx-swap="none"
                        class="text-[10px] font-black text-red-400 uppercase hover:text-red-600 transition-colors flex items-center space-x-2">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    <span>Clear All</span>
                </button>
            </div>
            
            <div id="filter-status" class="text-[10px] text-green-500 font-bold hidden uppercase text-center"></div>
            <div id="filter-error" class="text-[10px] text-red-500 font-bold hidden uppercase text-center"></div>
        </div>
    </div>
</div>

<script>
    function setPlatformFilter(val, btn) {
        document.getElementById('platform-filter-input').value = val;
        document.querySelectorAll('.plat-btn').forEach(b => {
            b.classList.remove('border-blue-500', 'bg-blue-50');
            b.classList.add('border-gray-100');
        });
        btn.classList.add('border-blue-500', 'bg-blue-50');
        btn.classList.remove('border-gray-100');
        // Trigger a refresh of the contact list
        document.body.dispatchEvent(new Event('refresh'));
    }

    function openFilterModal() {
        document.getElementById('filter-modal').classList.remove('hidden');
    }
    function closeFilterModal() {
        document.getElementById('filter-modal').classList.add('hidden');
        // Refresh contact list in case filters changed
        const contactList = document.getElementById('contact-list');
        if (contactList) {
            htmx.trigger(contactList, 'load'); // Trigger a reload
        }
    }
    
    // Add a custom refresh trigger for htmx
    document.addEventListener('DOMContentLoaded', () => {
        document.body.addEventListener('htmx:responseError', (evt) => {
            if (evt.detail.pathInfo.requestPath === '/filters/upload') {
                const errorDiv = document.getElementById('filter-error');
                if (errorDiv) {
                    errorDiv.innerText = evt.detail.xhr.responseText;
                    errorDiv.classList.remove('hidden');
                    setTimeout(() => errorDiv.classList.add('hidden'), 5000);
                }
            }
        });

        document.body.addEventListener('htmx:afterOnRequest', (evt) => {
            if (evt.detail.pathInfo.requestPath === '/filters/upload' && evt.detail.xhr.status === 200) {
                const statusDiv = document.getElementById('filter-status');
                if (statusDiv) {
                    statusDiv.innerText = evt.detail.xhr.responseText;
                    statusDiv.classList.remove('hidden');
                    setTimeout(() => statusDiv.classList.add('hidden'), 3000);
                }
            }
        });

        // Auto-select contact from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const autoContactId = urlParams.get('contact_id');

        if (autoContactId) {
            document.body.addEventListener('htmx:afterSettle', function handler(evt) {
                if (evt.detail.target.id === 'contact-list') {
                    const targetEl = document.getElementById(`contact-${autoContactId}`);
                    if (targetEl) {
                        targetEl.click();
                        targetEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        // Clean up URL without refreshing
                        const newUrl = window.location.pathname;
                        window.history.replaceState({}, '', newUrl);
                        // Remove listener after success
                        document.body.removeEventListener('htmx:afterSettle', handler);
                    }
                }
            });
        }

        document.body.addEventListener('refresh', () => {
            const list = document.getElementById('contact-list');
            if (list) {
                // Manually trigger htmx request with all current values
                const accountId = document.querySelector('[name="account_id"]').value;
                const platform = document.getElementById('platform-filter-input').value;
                const showDeclines = document.querySelector('[name="show_declines"]').value;
                const hideScreened = document.querySelector('[name="hide_screened"]').value;
                const hideUnanswered = document.querySelector('[name="hide_unanswered"]').value;
                const showIgnored = document.querySelector('[name="show_ignored"]').value;
                const sequenceFilter = document.querySelector('[name="sequence_filter"]').value;
                
                htmx.ajax('GET', '/contacts', {
                    target: '#contact-list', 
                    values: {
                        account_id: accountId,
                        platform: platform,
                        show_declines: showDeclines,
                        hide_screened: hideScreened,
                        hide_unanswered: hideUnanswered,
                        show_ignored: showIgnored,
                        sequence_filter: sequenceFilter
                    }
                });
            }
        });
    });
</script>

<style>
    /* Custom Scrollbar for a cleaner look */
    ::-webkit-scrollbar {
        width: 6px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
    }

    .htmx-indicator {
        display: none;
    }
    .htmx-request .htmx-indicator {
        display: inline;
    }
    .htmx-request.htmx-indicator {
        display: inline;
    }
    .htmx-request .htmx-indicator-hide {
        display: none;
    }
</style>
{{ end }}
