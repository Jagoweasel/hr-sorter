{{ define "content" }}
<div class="max-w-6xl mx-auto">
    <div class="flex flex-col lg:flex-row lg:justify-between lg:items-center mb-6 gap-4">
        <div class="flex items-center space-x-4 shrink-0">
            <h2 class="text-2xl font-bold text-gray-800 dark:text-white whitespace-nowrap">{{ Tr "system_logs" }}</h2>
            <div class="flex bg-gray-200 dark:bg-gray-700 p-1 rounded-xl gap-1 border dark:border-gray-600">
                <button onclick="applyPreset('dashboard')" class="px-3 py-1 text-[10px] font-black uppercase rounded-lg hover:bg-white dark:hover:bg-gray-600 transition-all">{{ Tr "preset_dashboard" }}</button>
                <button onclick="applyPreset('network')" class="px-3 py-1 text-[10px] font-black uppercase rounded-lg hover:bg-white dark:hover:bg-gray-600 transition-all">{{ Tr "preset_network" }}</button>
                <button onclick="applyPreset('logic')" class="px-3 py-1 text-[10px] font-black uppercase rounded-lg hover:bg-white dark:hover:bg-gray-600 transition-all">{{ Tr "preset_logic" }}</button>
            </div>
        </div>
        <div class="flex flex-wrap items-center justify-end gap-3 flex-1">
            <div class="flex flex-wrap items-center gap-3">
                <!-- Filter Controls -->
                <div class="flex flex-wrap bg-gray-100 dark:bg-gray-700 p-1.5 rounded-xl border dark:border-gray-600 gap-1">
                    <div class="flex gap-1 pr-1 border-r dark:border-gray-600 mr-1">
                        <button onclick="setLogCategory('ALL')" id="btn-all" class="px-2 py-1 rounded-lg text-[10px] font-black uppercase transition-colors bg-white dark:bg-gray-600 shadow-sm">{{ Tr "all" }}</button>
                        <button onclick="setLogCategory('NONE')" id="btn-none" class="px-2 py-1 rounded-lg text-[10px] font-black uppercase transition-colors hover:bg-white/50 dark:hover:bg-gray-600/50 text-gray-400">{{ Tr "none" }}</button>
                    </div>
                    
                    <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg text-[10px] font-black uppercase transition-colors category-btn-container" id="container-tg">
                        <button onclick="setLogCategory('TG')" id="btn-tg" class="text-gray-500 dark:text-gray-400 hover:text-blue-400">TG</button>
                        <input type="checkbox" id="chk-tg" checked onchange="toggleCategory('tg', this.checked)" class="w-3.5 h-3.5 rounded-md border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                    </div>

                    <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg text-[10px] font-black uppercase transition-colors category-btn-container" id="container-hh">
                        <button onclick="setLogCategory('HH')" id="btn-hh" class="text-gray-500 dark:text-gray-400 hover:text-red-400">HH</button>
                        <input type="checkbox" id="chk-hh" checked onchange="toggleCategory('hh', this.checked)" class="w-3.5 h-3.5 rounded-md border-gray-300 text-red-600 focus:ring-red-500 cursor-pointer">
                    </div>

                    <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg text-[10px] font-black uppercase transition-colors category-btn-container" id="container-sync">
                        <button onclick="setLogCategory('SYNC')" id="btn-sync" class="text-gray-500 dark:text-gray-400 hover:text-green-400">Sync</button>
                        <input type="checkbox" id="chk-sync" checked onchange="toggleCategory('sync', this.checked)" class="w-3.5 h-3.5 rounded-md border-gray-300 text-green-600 focus:ring-green-500 cursor-pointer">
                    </div>

                    <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg text-[10px] font-black uppercase transition-colors category-btn-container" id="container-add-sequence">
                        <button onclick="setLogCategory('ADD-SEQUENCE')" id="btn-add-sequence" class="text-gray-500 dark:text-gray-400 hover:text-orange-400">Sequences</button>
                        <input type="checkbox" id="chk-add-sequence" checked onchange="toggleCategory('add-sequence', this.checked)" class="w-3.5 h-3.5 rounded-md border-gray-300 text-orange-600 focus:ring-orange-500 cursor-pointer">
                    </div>

                    <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg text-[10px] font-black uppercase transition-colors category-btn-container" id="container-hh-net">
                        <button onclick="setLogCategory('HH-NET')" id="btn-hh-net" class="text-gray-500 dark:text-gray-400 hover:text-indigo-400">HH-Net</button>
                        <input type="checkbox" id="chk-hh-net" checked onchange="toggleCategory('hh-net', this.checked)" class="w-3.5 h-3.5 rounded-md border-gray-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                    </div>

                    <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg text-[10px] font-black uppercase transition-colors category-btn-container" id="container-msg">
                        <button onclick="setLogCategory('MSG')" id="btn-msg" class="text-gray-500 dark:text-gray-400 hover:text-purple-400">Msg</button>
                        <input type="checkbox" id="chk-msg" checked onchange="toggleCategory('msg', this.checked)" class="w-3.5 h-3.5 rounded-md border-gray-300 text-purple-600 focus:ring-purple-500 cursor-pointer">
                    </div>
                </div>

                <div class="flex items-center bg-gray-100 dark:bg-gray-700 p-1.5 rounded-xl border dark:border-gray-600 gap-2">
                    <span class="text-[10px] font-black uppercase text-gray-400 px-2 tracking-widest">Level</span>
                    <select id="log-level-select" onchange="updateLogLevel(this.value)" class="bg-transparent text-[10px] font-black outline-none dark:text-white uppercase cursor-pointer">
                        <option value="0">TRACE</option>
                        <option value="1">DEBUG</option>
                        <option value="2">INFO</option>
                        <option value="3">WARN</option>
                        <option value="4">ERROR</option>
                    </select>
                </div>

                <button onclick="clearLogs()" class="px-4 py-2 bg-gray-900 dark:bg-gray-700 hover:bg-black dark:hover:bg-gray-600 text-white rounded-xl text-[10px] font-black uppercase tracking-widest transition-all shadow-lg active:scale-95">
                    {{ Tr "clear" }}
                </button>
            </div>

            <div id="connection-status" class="flex items-center px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-200 border border-yellow-200 dark:border-yellow-800 whitespace-nowrap w-[120px] justify-center">
                <span class="w-2 h-2 rounded-full bg-yellow-500 mr-2"></span>
                {{ Tr "connecting" }}
            </div>
        </div>
    </div>

    <div id="log-container" class="bg-gray-900 text-gray-300 font-mono text-xs p-6 rounded-2xl h-[calc(100vh-250px)] overflow-y-auto border border-gray-800 shadow-2xl">
        <div class="text-gray-500 italic mb-4 opacity-50">{{ Tr "awaiting_logs" }}...</div>
    </div>
</div>

<script>
    const logContainer = document.getElementById('log-container');
    const statusEl = document.getElementById('connection-status');
    const translations = {
        live: '{{ Tr "live" }}',
        disconnected: '{{ Tr "disconnected" }}'
    };

    let eventSource;
    let currentCategory = localStorage.getItem('log-category') || 'ALL';
    let checkboxStates = JSON.parse(localStorage.getItem('log-checkboxes') || '{}');

    // Initialize UI from state and SYNC WITH SERVER
    async function initState() {
        const categories = ['tg', 'hh', 'sync', 'add-sequence', 'hh-net', 'msg'];
        
        // Sync checkboxes with server
        for (const cat of categories) {
            const chk = document.getElementById(`chk-${cat}`);
            if (chk) {
                if (checkboxStates[cat] !== undefined) {
                    chk.checked = checkboxStates[cat];
                }
                // Tell server about our state
                await fetch(`/logs/update?category=${cat}&enabled=${chk.checked}`, { 
                    method: 'POST',
                    headers: { 'X-CSRF-Token': getCsrfToken() }
                });
            }
        }
        
        const storedLevel = localStorage.getItem('log-level');
        if (storedLevel !== null) {
            const select = document.getElementById('log-level-select');
            if (select) {
                select.value = storedLevel;
                updateLogLevel(storedLevel);
            }
        }

        setLogCategory(currentCategory, false);
    }

    function getCsrfToken() {
        return '{{ csrfToken }}';
    }

    function toggleCategory(cat, enabled) {
        checkboxStates[cat] = enabled;
        localStorage.setItem('log-checkboxes', JSON.stringify(checkboxStates));
        
        fetch(`/logs/update?category=${cat}&enabled=${enabled}`, { 
            method: 'POST',
            headers: {
                'X-CSRF-Token': getCsrfToken()
            }
        });

        // Re-filter visible logs if we are in ALL view
        if (currentCategory === 'ALL' || currentCategory === 'NONE') {
            filterVisibleLogs();
        }
    }

    function filterVisibleLogs() {
        const entries = logContainer.querySelectorAll('div.log-entry');
        entries.forEach(entry => {
            const logCat = entry.getAttribute('data-category')?.toLowerCase();
            if (shouldShow(logCat, currentCategory)) {
                entry.classList.remove('hidden');
            } else {
                entry.classList.add('hidden');
            }
        });
    }

    function updateLogLevel(lvl) {
        localStorage.setItem('log-level', lvl);
        fetch(`/logs/update?level=${lvl}`, { 
            method: 'POST',
            headers: {
                'X-CSRF-Token': getCsrfToken()
            }
        });
    }

    const presets = {
        dashboard: ['tg', 'hh', 'sync'],
        network: ['hh-net', 'hh', 'sync'],
        logic: ['add-sequence', 'filters', 'msg']
    };

    function applyPreset(name) {
        const categories = presets[name];
        if (!categories) return;

        const allCats = ['tg', 'hh', 'sync', 'add-sequence', 'hh-net', 'msg'];
        
        allCats.forEach(cat => {
            const shouldEnable = categories.includes(cat);
            const checkbox = document.getElementById(`chk-${cat}`);
            if (checkbox && checkbox.checked !== shouldEnable) {
                checkbox.checked = shouldEnable;
                toggleCategory(cat, shouldEnable);
            }
        });
    }

    function setLogCategory(cat, filterExisting = true) {
        currentCategory = cat;
        localStorage.setItem('log-category', cat);
        
        // Reset all button and container styles
        document.querySelectorAll('[id^="btn-"]').forEach(btn => {
            btn.classList.remove('bg-white', 'dark:bg-gray-600', 'shadow-sm');
            if (btn.id !== 'btn-none') btn.classList.add('hover:bg-white/50', 'dark:hover:bg-gray-600/50');
        });
        document.querySelectorAll('.category-btn-container').forEach(c => {
            c.classList.remove('bg-white', 'dark:bg-gray-600', 'shadow-sm');
            c.classList.add('hover:bg-white/50', 'dark:hover:bg-gray-600/50');
        });

        // Highlight selected
        const btn = document.getElementById(`btn-${cat.toLowerCase()}`);
        if (btn) {
            const isPlatform = !['btn-all', 'btn-none'].includes(btn.id);
            const target = isPlatform ? btn.parentElement : btn;
            target.classList.add('bg-white', 'dark:bg-gray-600', 'shadow-sm');
            target.classList.remove('hover:bg-white/50', 'dark:hover:bg-gray-600/50');
        }

        // Special case for ALL: enable all checkboxes
        if (cat === 'ALL') {
            const categories = ['tg', 'hh', 'sync', 'add-sequence', 'hh-net', 'msg'];
            categories.forEach(c => {
                const checkbox = document.getElementById(`chk-${c}`);
                if (checkbox && !checkbox.checked) {
                    checkbox.checked = true;
                    toggleCategory(c, true);
                }
            });
        }

        // Special case for NONE: disable all checkboxes
        if (cat === 'NONE') {
            const categories = ['tg', 'hh', 'sync', 'add-sequence', 'hh-net', 'msg'];
            categories.forEach(c => {
                const checkbox = document.getElementById(`chk-${c}`);
                if (checkbox && checkbox.checked) {
                    checkbox.checked = false;
                    toggleCategory(c, false);
                }
            });
        }

        if (filterExisting) {
            filterVisibleLogs();
        }
    }

    async function loadHistory() {
        try {
            const resp = await fetch(`/logs/history?category=${currentCategory}&limit=500`);
            const logs = await resp.json();
            
            logContainer.innerHTML = '';
            if (logs.length === 0) {
                const placeholder = document.createElement('div');
                placeholder.className = 'text-gray-500 italic mb-4 opacity-50';
                placeholder.textContent = '{{ Tr "awaiting_logs" }}...';
                logContainer.appendChild(placeholder);
                return;
            }

            logs.forEach(log => appendLog(log, false));
            logContainer.scrollTop = logContainer.scrollHeight;
        } catch (e) {
            console.error('Failed to load history:', e);
        }
    }

    function appendLog(logData, scroll = true) {
        const placeholder = logContainer.querySelector('.italic');
        if (placeholder) {
            logContainer.removeChild(placeholder);
        }

        const div = document.createElement('div');
        const level = logData.level.toUpperCase();
        const cat = (logData.category || 'system').toUpperCase();
        const msg = logData.msg || logData.message || '';
        const ts = logData.ts || logData.timestamp || '';

        div.className = 'log-entry mb-1 border-l-2 border-transparent hover:border-gray-700 dark:hover:border-gray-500 pl-2 transition-colors whitespace-pre-wrap break-all';
        div.setAttribute('data-category', cat);
        
        const formattedTs = ts.split(' ')[1] || ts;
        div.textContent = `[${formattedTs}] [${level}] [${cat}] ${msg}`;

        if (level === 'ERROR' || level === 'DPANIC' || level === 'PANIC' || level === 'FATAL') {
            div.classList.add('text-red-400');
        } else if (level === 'WARN') {
            div.classList.add('text-yellow-400');
        } else if (level === 'DEBUG') {
            div.classList.add('text-gray-500');
        } else if (cat === 'HISTORY') {
            div.classList.add('text-blue-300', 'font-bold');
        } else if (cat === 'SYSTEM' || cat === 'MAIN' || cat === 'DB') {
            div.classList.add('text-blue-400', 'font-bold');
        }

        if (!shouldShow(cat, currentCategory)) {
            div.classList.add('hidden');
        }

        logContainer.appendChild(div);
        
        if (scroll && logContainer.scrollHeight - logContainer.scrollTop - logContainer.clientHeight < 250) {
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        if (logContainer.children.length > 2000) {
            logContainer.removeChild(logContainer.firstChild);
        }
    }

    function shouldShow(logCat, filterCat) {
        const cat = logCat ? logCat.toLowerCase() : 'system';
        const isPlatformEnabled = checkboxStates[cat] !== false; 
        
        if (filterCat === 'NONE') return false;
        if (!isPlatformEnabled && filterCat === 'ALL') return false;
        if (filterCat === 'ALL') return true;
        return cat === filterCat.toLowerCase();
    }

    function connect() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }
        
        eventSource = new EventSource('/logs/stream?t=' + Date.now());
        
        eventSource.onopen = () => {
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></span>${translations.live}`;
            statusEl.className = 'flex items-center px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-200 border border-green-200 dark:border-green-800 whitespace-nowrap w-[120px] justify-center';
        };

        eventSource.onerror = (e) => {
            if (eventSource && eventSource.readyState === EventSource.CLOSED) return;
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 mr-2"></span>${translations.disconnected}`;
            statusEl.className = 'flex items-center px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-200 border border-red-200 dark:border-red-800 whitespace-nowrap w-[120px] justify-center';
        };

        eventSource.onmessage = (e) => {
            if (!e.data) return;
            try {
                const logData = JSON.parse(e.data);
                appendLog(logData);
            } catch (err) {
                if (e.data.startsWith(':')) return;
                appendLog({ level: 'INFO', category: 'system', msg: e.data, ts: new Date().toISOString() });
            }
        };
    }

    function clearLogs() {
        logContainer.innerHTML = '';
    }

    // Cleanup on HTMX nav
    document.body.addEventListener('htmx:beforeCleanupElement', (evt) => {
        if (evt.detail.elt.contains(logContainer)) {
            if (eventSource) {
                console.log('[Logs] Closing SSE');
                eventSource.close();
                eventSource = null;
            }
        }
    });

    // Initialize only after DOM is settled
    document.body.addEventListener('htmx:afterSettle', (evt) => {
        if (document.getElementById('log-container')) {
            initLogs();
        }
    });

    async function initLogs() {
        await initState();
        await loadHistory();
        connect();
    }

    // Initial load
    if (document.getElementById('log-container')) {
        initLogs();
    }

    window.addEventListener('beforeunload', () => {
        if (eventSource) eventSource.close();
    });
</script>
{{ end }}
