{{ define "content" }}
<div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800 dark:text-white">{{ Tr "system_logs" }}</h2>
        <div class="flex space-x-2">
            <button onclick="clearLogs()" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded text-sm transition-colors">
                Clear
            </button>
            <div id="connection-status" class="flex items-center px-3 py-1 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200">
                <span class="w-2 h-2 rounded-full bg-yellow-500 mr-2"></span>
                Connecting...
            </div>
        </div>
    </div>

    <div class="bg-black text-green-400 p-4 rounded-lg shadow-inner font-mono text-sm h-[600px] overflow-y-auto" id="log-container">
        <div class="opacity-50 italic">Waiting for logs...</div>
    </div>
</div>

<script>
    const logContainer = document.getElementById('log-container');
    const statusEl = document.getElementById('connection-status');
    let eventSource;

    function connect() {
        if (eventSource) eventSource.close();
        
        eventSource = new EventSource('/logs/stream');
        
        eventSource.onopen = () => {
            statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></span>Live';
            statusEl.className = 'flex items-center px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200';
        };

        eventSource.onerror = (e) => {
            console.error('SSE error:', e);
            statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500 mr-2"></span>Disconnected';
            statusEl.className = 'flex items-center px-3 py-1 rounded-full text-xs font-medium bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200';
            setTimeout(connect, 3000);
        };

        eventSource.onmessage = (e) => {
            const div = document.createElement('div');
            div.className = 'mb-1 border-l-2 border-transparent hover:border-gray-700 pl-2 transition-colors';
            
            // Basic syntax highlighting for common log levels
            let line = e.data;
            if (line.includes('[ERROR]') || line.includes('"level":"error"')) {
                div.classList.add('text-red-400');
            } else if (line.includes('[WARN]') || line.includes('"level":"warn"')) {
                div.classList.add('text-yellow-400');
            } else if (line.includes('[DEBUG]') || line.includes('"level":"debug"')) {
                div.classList.add('text-gray-500');
            }

            div.textContent = line;
            logContainer.appendChild(div);
            
            // Auto-scroll to bottom if near bottom
            if (logContainer.scrollHeight - logContainer.scrollTop - logContainer.clientHeight < 100) {
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        };
    }

    function clearLogs() {
        logContainer.innerHTML = '';
    }

    connect();

    // Cleanup on page leave
    window.addEventListener('beforeunload', () => {
        if (eventSource) eventSource.close();
    });
</script>
{{ end }}
