{{ define "content" }}
<div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800 dark:text-white">{{ Tr "system_logs" }}</h2>
        <div class="flex flex-wrap items-center gap-3">
            <!-- Filter Controls -->
            <div class="flex flex-wrap bg-gray-100 dark:bg-gray-700 p-1 rounded-lg border dark:border-gray-600 gap-1">
                <button onclick="setLogCategory('ALL')" id="btn-all" class="px-3 py-1 rounded-md text-xs font-bold transition-colors bg-white dark:bg-gray-600 shadow-sm">{{ Tr "all" }}</button>
                {{ range $cat, $enabled := .Categories }}
                <div class="flex items-center gap-1 px-2 py-1 rounded-md text-xs font-bold transition-colors hover:bg-white/50 dark:hover:bg-gray-600/50">
                    <button onclick="setLogCategory('{{ $cat }}')" id="btn-{{ $cat | lower }}" class="text-gray-600 dark:text-gray-300">{{ $cat }}</button>
                    <input type="checkbox" {{ if $enabled }}checked{{ end }} 
                           onchange="toggleCategory('{{ $cat }}', this.checked)"
                           class="w-3 h-3 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                </div>
                {{ end }}
            </div>

            <div class="flex items-center bg-gray-100 dark:bg-gray-700 p-1 rounded-lg border dark:border-gray-600 gap-2">
                <span class="text-[10px] font-black uppercase text-gray-500 px-2">Level</span>
                <select onchange="updateLogLevel(this.value)" class="bg-transparent text-xs font-bold outline-none dark:text-white">
                    <option value="0" {{ if eq .Level 0 }}selected{{ end }}>TRACE</option>
                    <option value="1" {{ if eq .Level 1 }}selected{{ end }}>DEBUG</option>
                    <option value="2" {{ if eq .Level 2 }}selected{{ end }}>INFO</option>
                    <option value="3" {{ if eq .Level 3 }}selected{{ end }}>WARN</option>
                    <option value="4" {{ if eq .Level 4 }}selected{{ end }}>ERROR</option>
                </select>
            </div>


            <button onclick="clearLogs()" class="px-4 py-1.5 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded-lg text-xs font-bold transition-colors border dark:border-gray-600">
                {{ Tr "clear" }}
            </button>
            <div id="connection-status" class="flex items-center px-3 py-1.5 rounded-lg text-xs font-bold bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-200 border border-yellow-200 dark:border-yellow-800">
                <span class="w-2 h-2 rounded-full bg-yellow-500 mr-2"></span>
                {{ Tr "connecting" }}
            </div>
        </div>
    </div>

    <div id="log-container" class="bg-gray-900 text-gray-300 font-mono text-xs p-6 rounded-2xl h-[calc(100vh-250px)] overflow-y-auto border border-gray-800 shadow-2xl">
        <div class="text-gray-500 italic mb-4 opacity-50">{{ Tr "awaiting_logs" }}...</div>
    </div>
</div>

<script>
    const logContainer = document.getElementById('log-container');
    const statusEl = document.getElementById('connection-status');
    const translations = {
        live: '{{ Tr "live" }}',
        disconnected: '{{ Tr "disconnected" }}'
    };

    let eventSource;
    let currentCategory = 'ALL';

    function toggleCategory(cat, enabled) {
        fetch(`/logs/update?category=${cat}&enabled=${enabled}`, { method: 'POST' });
    }

    function updateLogLevel(lvl) {
        fetch(`/logs/update?level=${lvl}`, { method: 'POST' });
    }

    function setLogCategory(cat) {
        currentCategory = cat;
        
        // Update button styles
        document.querySelectorAll('[id^="btn-"]').forEach(btn => {
            if (btn.id === `btn-${cat.toLowerCase()}`) {
                btn.parentElement.classList.add('bg-white', 'dark:bg-gray-600', 'shadow-sm');
                btn.parentElement.classList.remove('hover:bg-white/50', 'dark:hover:bg-gray-600/50');
            } else {
                btn.parentElement.classList.remove('bg-white', 'dark:bg-gray-600', 'shadow-sm');
                btn.parentElement.classList.add('hover:bg-white/50', 'dark:hover:bg-gray-600/50');
            }
        });

        // Filter existing logs
        const entries = logContainer.querySelectorAll('div.log-entry');
        entries.forEach(entry => {
            if (shouldShow(entry.textContent, cat)) {
                entry.classList.remove('hidden');
            } else {
                entry.classList.add('hidden');
            }
        });
    }

    function shouldShow(text, cat) {
        if (cat === 'ALL') return true;
        const upperText = text.toUpperCase();
        return upperText.includes(`[${cat}]`);
    }

    function connect() {
        if (eventSource) eventSource.close();
        
        eventSource = new EventSource('/logs/stream');
        
        eventSource.onopen = () => {
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></span>${translations.live}`;
            statusEl.className = 'flex items-center px-3 py-1.5 rounded-lg text-xs font-bold bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-200 border border-green-200 dark:border-yellow-800';
        };

        eventSource.onerror = (e) => {
            console.error('SSE error:', e);
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 mr-2"></span>${translations.disconnected}`;
            statusEl.className = 'flex items-center px-3 py-1.5 rounded-lg text-xs font-bold bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-200 border border-red-200 dark:border-red-800';
            setTimeout(connect, 3000);
        };

        eventSource.onmessage = (e) => {
            const div = document.createElement('div');
            div.className = 'log-entry mb-1 border-l-2 border-transparent hover:border-gray-700 dark:hover:border-gray-500 pl-2 transition-colors';
            
            let line = e.data;
            if (line.includes('[ERROR]')) {
                div.classList.add('text-red-400');
            } else if (line.includes('[WARN]')) {
                div.classList.add('text-yellow-400');
            } else if (line.includes('[DEBUG]')) {
                div.classList.add('text-gray-500');
            }

            if (!shouldShow(line, currentCategory)) {
                div.classList.add('hidden');
            }

            div.textContent = line;
            logContainer.appendChild(div);
            
            if (logContainer.scrollHeight - logContainer.scrollTop - logContainer.clientHeight < 100) {
                logContainer.scrollTop = logContainer.scrollHeight;
            }

            if (logContainer.children.length > 2000) {
                logContainer.removeChild(logContainer.firstChild);
            }
        };
    }

    function clearLogs() {
        logContainer.innerHTML = '';
    }

    connect();

    window.addEventListener('beforeunload', () => {
        if (eventSource) eventSource.close();
    });
</script>
{{ end }}
